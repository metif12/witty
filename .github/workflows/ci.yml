name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  V_C_ERROR_BUG_REPORT_DISABLED: '1'
  V_MACOS_V3_NO_FALLBACK: '1'
  VFLAGS: -cc clang

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install freetype harfbuzz fontconfig oniguruma pkg-config gettext
      - name: Install Metal toolchain
        # Xcode 26 ships the Metal compiler as a separate component.
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Check
        run: v -check .
      - name: Build
        # Universal (arm64 + x86_64) app, as released. The standalone XCFramework
        # is skipped: its iOS slices need a V whose iOS C output compiles.
        # A cached build can omit declarations for specialized destructors.
        env:
          VFLAGS: -cc clang -nocache
        run: v -path "$PWD|@vlib|@vmodules" run tools/build install -Demit-xcframework=false -Demit-macos-app=true --prefix "$RUNNER_TEMP/witty"
      - name: Verify app binary
        # Universal, and not tied to the CI runner's V install (libgc.dylib).
        run: |
          exe="$RUNNER_TEMP/witty/Ghostty.app/Contents/MacOS/ghostty"
          lipo -info "$exe"
          lipo "$exe" -verify_arch arm64 x86_64
          if otool -L "$exe" | grep -q libgc; then otool -L "$exe"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: witty-macos
          path: ${{ runner.temp }}/witty
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config gettext python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-dev libadwaita-1-dev meson ninja-build \
            libfreetype-dev libharfbuzz-dev libfontconfig-dev libonig-dev \
            libx11-dev libwayland-dev wayland-protocols libgl-dev
      - name: Build gtk4-layer-shell
        # Ubuntu 24.04 does not package it; 1.1.0 is the version Ghostty pins.
        run: |
          git clone --depth 1 --branch v1.1.0 https://github.com/wmww/gtk4-layer-shell "$RUNNER_TEMP/gtk4-layer-shell"
          cd "$RUNNER_TEMP/gtk4-layer-shell"
          meson setup build --prefix=/usr -Dintrospection=false -Dvapi=false -Ddocs=false -Dexamples=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
      - name: Install blueprint-compiler
        # Ghostty's UI files need 0.16.0+; Ubuntu 24.04's package is older.
        run: |
          git clone --depth 1 --branch v0.16.0 https://gitlab.gnome.org/GNOME/blueprint-compiler.git "$RUNNER_TEMP/blueprint-compiler"
          cd "$RUNNER_TEMP/blueprint-compiler"
          meson setup build --prefix=/usr
          sudo ninja -C build install
          blueprint-compiler --version
      - name: Build host cimgui archive
        # Host generator tools link cimgui/lib/libdcimgui_linux.a, which is not committed.
        run: CXX=clang++ sh cimgui/build.sh
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Check
        run: v -check .
      - name: Build
        run: |
          (
            while sleep 120; do
              ps -eo pid,ppid,stat,etime,time,rss,wchan:32,comm --forest
              build_pid=$(pgrep -n -x build || true)
              if [[ -n "$build_pid" ]] && command -v gdb >/dev/null; then
                sudo timeout 10s gdb -nx -batch -ex 'thread apply all bt' -p "$build_pid" || true
              fi
            done
          ) &
          progress_pid=$!
          trap 'kill "$progress_pid" 2>/dev/null || true' EXIT
          v -gc none -path "$PWD|@vlib|@vmodules" run tools/build install --prefix "$RUNNER_TEMP/witty"
      - uses: actions/upload-artifact@v7
        with:
          name: witty-linux
          path: ${{ runner.temp }}/witty
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # tools/build itself is compiled with MinGW gcc: clang's default MSVC
      # target hits MSVC-only intrinsics (_udiv128) in V's runtime.
      VFLAGS: -cc gcc
      # The build driver passes clang target triples (x86_64-w64-windows-gnu)
      # to the native and VT compiles, so those need clang.
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install V
        run: bash .github/scripts/install-v.sh
      - name: Build libghostty-vt
        run: v -path "$PWD|@vlib|@vmodules" run tools/build lib-vt --prefix "$RUNNER_TEMP/witty"
      - uses: actions/upload-artifact@v7
        with:
          name: witty-vt-windows
          path: ${{ runner.temp }}/witty
          if-no-files-found: warn
